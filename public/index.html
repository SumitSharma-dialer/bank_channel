<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IOTIndia</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23101418'/%3E%3Cpath d='M6 10h8M6 16h8M6 22h8M18 16h8M14 10l4 6-4 6' stroke='%2337d39a' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=diag8">
</head>
<body>
<div id="login" class="login hidden">
  <form id="loginForm" class="login-card">
    <div class="brand big"><span class="logo"></span><div><b>IOTIndia</b><small>Admin console</small></div></div>
    <label>Username<input name="username" value="admin" autocomplete="username" required></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required autofocus></label>
    <p class="err" id="loginErr"></p>
    <button class="btn primary wide">Sign in</button>
  </form>
</div>

<div id="app" class="shell hidden">
  <aside class="side">
    <div class="brand"><span class="logo"></span><div><b>IOTIndia</b><small>channel distributor</small></div></div>
    <nav id="nav">
      <a href="#/live"       data-page="live"><i>◉</i>Live dashboard</a>
      <a href="#/trunks"     data-page="trunks"><i>⇥</i>SIP trunks</a>
      <a href="#/processes"  data-page="processes"><i>▦</i>Processes</a>
      <a href="#/cdr"        data-page="cdr"><i>≡</i>CDR report</a>
      <a href="#/stats"      data-page="stats"><i>▤</i>Daily statistics</a>
      <a href="#/diag"       data-page="diag"><i>✚</i>Diagnostics<span class="nbadge hidden" id="navIssues"></span></a>
      <a href="#/dispositions" data-page="dispositions"><i>◈</i>Dispositions</a>
      <a href="#/system"     data-page="system"><i>⚙</i>System</a>
    </nav>
    <div class="side-foot">
      <div class="conn" id="conn"><span class="dot"></span><span>connecting…</span></div>
      <div class="who"><span id="who"></span><button class="link" id="logout">Sign out</button></div>
    </div>
  </aside>
  <main id="main"></main>
</div>

<div id="modal" class="modal hidden"><div class="modal-card" role="dialog" aria-modal="true"></div></div>
<div id="toasts"></div>
<script src="app.js?v=diag8"></script>
</body>
</html>
