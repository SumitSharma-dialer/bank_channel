# -> /etc/sysctl.d/90-sipdist.conf : kernel network buffers for many concurrent RTP streams
# bigger UDP socket buffers so bursts of RTP/SIP packets are not dropped
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576
# packets queued per CPU before the kernel processes them (default 1000)
net.core.netdev_max_backlog = 10000
# keep ephemeral ports above the RTP range (rtp.conf rtpstart=10000 rtpend=30000)
net.ipv4.ip_local_port_range = 32768 60999
