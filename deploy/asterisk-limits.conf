# systemd drop-in for asterisk.service -> /etc/systemd/system/asterisk.service.d/sipdist-limits.conf
# Each call holds ~4-6 file handles (RTP + RTCP per leg, SIP); the systemd default soft limit of 1024
# caps Asterisk at ~200 calls. Each channel also runs its own threads.
[Service]
LimitNOFILE=1048576
LimitNPROC=infinity
TasksMax=infinity
