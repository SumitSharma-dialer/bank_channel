; SIP Channel Distributor — base PJSIP config.
; Trunks and customer endpoints are GENERATED by the backend into /etc/asterisk/sipdist/
; Do not add endpoints here — use the web UI.

[global]
type=global
user_agent=SIPDist
; ip first (IP-auth processes + trunks), then digest username
endpoint_identifier_order=ip,auth_username,username
max_forwards=20
keep_alive_interval=30
; unknown requests get 401 and are dropped quietly
unidentified_request_count=5
unidentified_request_period=5
unidentified_request_prune_interval=30

[system]
type=system
timer_t1=500
timer_b=32000
disable_tcp_switch=yes
; worker threads: raise if you run >500 concurrent calls
threadpool_initial_size=16
threadpool_auto_increment=8
threadpool_max_size=128

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address=__EXTERNAL_IP__
external_signaling_address=__EXTERNAL_IP__
local_net=127.0.0.0/8
local_net=10.0.0.0/8
local_net=172.16.0.0/12
local_net=192.168.0.0/16

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060
external_media_address=__EXTERNAL_IP__
external_signaling_address=__EXTERNAL_IP__
local_net=127.0.0.0/8
local_net=10.0.0.0/8
local_net=172.16.0.0/12
local_net=192.168.0.0/16

; ---- generated by the backend (UI → PostgreSQL → files → ARI reload) ----
#tryinclude sipdist/trunks.conf
#tryinclude sipdist/processes.conf
