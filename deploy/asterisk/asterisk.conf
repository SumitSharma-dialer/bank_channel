[directories](!)
astcachedir => /var/cache/asterisk
astetcdir => /etc/asterisk
astmoddir => /usr/lib/asterisk/modules
astvarlibdir => /var/lib/asterisk
astdbdir => /var/lib/asterisk
astkeydir => /var/lib/asterisk
astdatadir => /var/lib/asterisk
astagidir => /var/lib/asterisk/agi-bin
astspooldir => /var/spool/asterisk
astrundir => /var/run/asterisk
astlogdir => /var/log/asterisk
astsbindir => /usr/sbin

[options]
runuser = asterisk
rungroup = asterisk
verbose = 0
debug = 0
; hard ceiling for the whole box (sum of all trunks); 0 = no ceiling
maxcalls = 0
; do not accept new calls if load average goes above this
maxload = 0
; open file handles (each call ~4-6: RTP/RTCP per leg + SIP); also set by LimitNOFILE in the systemd drop-in
maxfiles = 1048576
transmit_silence = no
hideconnect = yes
