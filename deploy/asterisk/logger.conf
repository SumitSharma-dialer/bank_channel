[general]
dateformat=%F %T
queue_log=no

[logfiles]
; keep logging light on a busy box: no verbose/debug file
console => notice,warning,error
messages.log => notice,warning,error
; what the Asterisk CLI shows (verbose 3); kept 3 days by /etc/logrotate.d/asterisk
full => notice,warning,error,verbose(3),dtmf
